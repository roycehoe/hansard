name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.14.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm contrast
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.14.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install the frontend dependencies for the contract check
        working-directory: app
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -m "not database"

  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hansard_launch
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U user -d hansard_launch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: roycehoe/hansard-scraper
          ref: master
          path: scraper
      - name: Install the rum extension into the database container
        run: docker exec ${{ job.services.postgres.id }} sh -c "apt-get update && apt-get install -y --no-install-recommends postgresql-17-rum"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the psycopg2 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev gcc
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install the scraper dependencies
        working-directory: scraper
        run: poetry install --no-root --no-interaction
      - name: Create the rum extension
        run: docker exec ${{ job.services.postgres.id }} psql -U user -d hansard_launch -c "CREATE EXTENSION IF NOT EXISTS rum"
      - name: Build the scraper tables with its migrations
        working-directory: scraper
        env:
          DATABASE_URL: postgresql://user:password@localhost:5435/hansard_launch
        run: poetry run alembic upgrade head
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
      - name: Install the API dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Select every column the API models declare
        working-directory: api
        run: uv run pytest -m schema_drift

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.14.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
      - name: Install the frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Write a CycloneDX SBOM for each subsystem
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom"
          (cd app && pnpm dlx @cyclonedx/cdxgen@12.9.0 -t js -o "${RUNNER_TEMP}/sbom/app.cdx.json" .)
          (cd api && uv export --frozen --format cyclonedx1.5 -o "${RUNNER_TEMP}/sbom/api.cdx.json")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      - name: Audit the frontend dependencies
        working-directory: app
        run: pnpm audit --audit-level high
      - name: Audit the API dependencies
        working-directory: api
        run: |
          uv export --frozen --no-emit-project -o "${RUNNER_TEMP}/api-requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip -r "${RUNNER_TEMP}/api-requirements.txt"

  deploy:
    needs: [app, api, schema-drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          TAKEDOWN_REPORT_SLUGS: ${{ secrets.TAKEDOWN_REPORT_SLUGS }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          SCRAPER_DATABASE_URL: ${{ secrets.SCRAPER_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Smoke test the deployed site
        env:
          SITE: https://openhansard.sg
        run: |
          failed=0
          for path in \
            "/api/coverage?smoke=${GITHUB_RUN_ID}" \
            "/api/reports/written-answer-16079" \
            "/api/search/speeches?q=heat+stress" \
            "/sitemap.xml"; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SITE}${path}" || true)
              echo "${path} attempt ${attempt}: ${status}"
              if [ "${status}" = "200" ]; then ok=1; break; fi
              if [ "${attempt}" -lt 6 ]; then sleep 20; fi
            done
            if [ "${ok}" -ne 1 ]; then failed=1; fi
          done
          exit "${failed}"

  live-site:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.14.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Open the live site in a browser
        run: pnpm e2e
