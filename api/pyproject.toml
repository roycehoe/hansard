[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi[standard]==0.143.0",
    "sqlmodel==0.0.48",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["I", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "database: needs the scratch database",
    "schema_drift: selects every column the models declare, from a database built from the scraper's models",
]
