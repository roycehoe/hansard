name: hansard
region: sgp
domains:
  - domain: openhansard.sg
    type: PRIMARY
  - domain: hansard.fancybinary.sg
    type: ALIAS
ingress:
  rules:
    - match:
        authority:
          exact: hansard.fancybinary.sg
        path:
          prefix: /
      redirect:
        authority: openhansard.sg
        scheme: https
        redirect_code: 301
    - match:
        path:
          prefix: /
      component:
        name: web
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: web
    github:
      repo: roycehoe/hansard
      branch: master
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      timeout_seconds: 5
      failure_threshold: 12
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 0.5
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: FIVE_MINUTES
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${DATABASE_URL}
      - key: BASIC_AUTH_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: ${BASIC_AUTH_USERNAME}
      - key: BASIC_AUTH_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${BASIC_AUTH_PASSWORD}
      - key: PUBLIC_MODE
        scope: RUN_TIME
        value: "true"
      - key: TAKEDOWN_REPORT_SLUGS
        scope: RUN_TIME
        type: SECRET
        value: ${TAKEDOWN_REPORT_SLUGS}
      - key: SITE_URL
        scope: RUN_TIME
        value: https://openhansard.sg
      - key: GOATCOUNTER_SITE_URL
        scope: RUN_TIME
        value: https://royceinbox.goatcounter.com
      - key: GOATCOUNTER_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ${GOATCOUNTER_API_TOKEN}
      - key: VITE_CONTACT_EMAIL
        scope: BUILD_TIME
        value: royceinbox@hotmail.com
      - key: VITE_RESEARCHERS_FORM_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_ANALYTICS_URL
        scope: BUILD_TIME
        value: https://royceinbox.goatcounter.com/count
jobs:
  - name: refresh
    kind: SCHEDULED
    github:
      repo: roycehoe/hansard-scraper
      branch: master
      deploy_on_push: true
    dockerfile_path: Dockerfile
    run_command: sh refresh.sh
    instance_size_slug: apps-s-1vcpu-2gb
    schedule:
      cron: "0 20 * * *"
      time_zone: UTC
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${SCRAPER_DATABASE_URL}
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ${TELEGRAM_BOT_TOKEN}
      - key: TELEGRAM_CHAT_ID
        scope: RUN_TIME
        type: SECRET
        value: ${TELEGRAM_CHAT_ID}
      - key: HEALTHCHECKS_PING_URL
        scope: RUN_TIME
        type: SECRET
        value: ${HEALTHCHECKS_PING_URL}
