name: hansard
region: sgp
domains:
  - domain: hansard.fancybinary.sg
    type: PRIMARY
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: web
    github:
      repo: roycehoe/hansard
      branch: master
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 0.5
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: FIVE_MINUTES
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: BASIC_AUTH_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: BASIC_AUTH_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: PUBLIC_MODE
        scope: RUN_TIME
        value: "false"
      - key: TAKEDOWN_REPORT_SLUGS
        scope: RUN_TIME
        type: SECRET
      - key: SITE_URL
        scope: RUN_TIME
        value: https://hansard.fancybinary.sg
      - key: VITE_CONTACT_EMAIL
        scope: BUILD_TIME
        value: hansard@fancybinary.sg
      - key: VITE_RESEARCHERS_FORM_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_ANALYTICS_URL
        scope: BUILD_TIME
        value: ""
jobs:
  - name: refresh
    kind: SCHEDULED
    github:
      repo: roycehoe/hansard-scraper
      branch: master
      deploy_on_push: false
    dockerfile_path: Dockerfile
    run_command: python refresh.py
    instance_size_slug: apps-s-1vcpu-2gb
    schedule:
      cron: "0 20 * * *"
      time_zone: UTC
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_CHAT_ID
        scope: RUN_TIME
        type: SECRET
      - key: HEALTHCHECKS_PING_URL
        scope: RUN_TIME
        type: SECRET
