name: hansard
region: sgp
services:
  - name: web
    github:
      repo: roycehoe/hansard
      branch: master
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: BASIC_AUTH_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: BASIC_AUTH_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: PUBLIC_MODE
        scope: RUN_TIME
        value: "false"
      - key: VITE_CONTACT_EMAIL
        scope: BUILD_TIME
        value: hansard@fancybinary.sg
      - key: VITE_RESEARCHERS_FORM_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_ANALYTICS_URL
        scope: BUILD_TIME
        value: ""
