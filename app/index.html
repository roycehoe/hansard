<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--preview-tags-->
    <title>Open Hansard</title>
    <!--/preview-tags-->
    <script>
      try {
        const stored = localStorage.getItem('theme')
        const isDark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
      } catch {}
      try {
        const appearance = JSON.parse(
          localStorage.getItem('appearance') ?? '{}'
        )
        const root = document.documentElement
        if (appearance.textSize) root.dataset.textSize = appearance.textSize
        if (appearance.width) root.dataset.width = appearance.width
        if (appearance.columnNumbers) {
          root.dataset.columns = appearance.columnNumbers
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
